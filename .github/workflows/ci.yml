# CI: tests del backend (pytest contra MariaDB real), lint y build del frontend.
#
# Corre en cada push y pull request, y el workflow de deploy lo llama antes de
# construir la imagen (workflow_call): si algo falla, no se deploya.

name: CI

on:
  push:
  pull_request:
  workflow_call:

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: clubes_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    defaults:
      run:
        working-directory: apps/backend
    env:
      TEST_DATABASE_URL: mysql://root:root@127.0.0.1:3306/clubes_test
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: apps/backend/requirements*.txt

      - run: pip install -r requirements-dev.txt

      - name: Modelos y migraciones sincronizados
        # Falla si alguien cambió models.py sin crear la migración
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
          JWT_SECRET: ci-jwt-secret-con-mas-de-32-caracteres
        run: |
          python -m app.db_init
          alembic check

      - run: pytest

  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: ""
