# Configuración de Alembic para la CLI (autogenerate de migraciones nuevas):
#   alembic revision --autogenerate -m "descripcion"
#   alembic upgrade head
# La app no la necesita: db_init arma la configuración por código (ver app/migrate.py).
# La URL de la base sale de DATABASE_URL (.env), no de este archivo.

[alembic]
script_location = %(here)s/app/migrations
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = .
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
