# Compose de PROD - el workflow lo copia al VPS como docker-compose.yml
#
# El VPS ya tiene MariaDB y Nginx instalados a nivel de sistema operativo:
# este compose levanta SOLO la app. El contenedor llega al MariaDB del host
# vía host.docker.internal (host-gateway) - ver deploy.md §2 para preparar
# la base y el usuario.
#
# En la carpeta de deploy conviven solo 3 cosas:
#   .env                (creado a mano una vez; es la identidad del club)
#   docker-compose.yml  (este archivo, actualizado en cada deploy)
#   recursos/           (volumen persistente: fotos de socios, documentos, etc.)
#
# La app expone UN solo puerto (${PORT}) en loopback: la API sirve también la
# web estática y /recursos. Nginx (host) hace proxy con TLS. Ver nginx.conf.

services:
  app:
    # __IMAGE__ lo reemplaza el workflow en cada deploy por ghcr.io/<repo>:<sha>
    # (el archivo queda autocontenido: up/restart manuales no necesitan variables)
    image: __IMAGE__
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      # Un solo puerto, solo en loopback: Nginx es la puerta de entrada
      - "127.0.0.1:${PORT:-3030}:3001"
    volumes:
      - ./recursos:/app/recursos
    environment:
      # MariaDB del host: mysql://usuario:pass@host.docker.internal:3306/clubes_db
      DATABASE_URL: ${DATABASE_URL:?Definir DATABASE_URL en .env}
      JWT_SECRET: ${JWT_SECRET:?Definir JWT_SECRET en .env}
      QR_SECRET: ${QR_SECRET:-}
      FRONTEND_URL: ${FRONTEND_URL:?Definir FRONTEND_URL en .env}
      API_PUBLIC_URL: ${API_PUBLIC_URL:-}
      # Clave Fernet para cifrar las credenciales de Mercado Pago en la base
      # (opcional: sin ella se deriva de JWT_SECRET)
      SECRETS_KEY: ${SECRETS_KEY:-}
      MERCADO_PAGO_ACCESS_TOKEN: ${MERCADO_PAGO_ACCESS_TOKEN:-}
      MERCADO_PAGO_WEBHOOK_SECRET: ${MERCADO_PAGO_WEBHOOK_SECRET:-}
      # /api/docs apagado en producción (ENABLE_DOCS=1 en .env para prenderlo)
      ENABLE_DOCS: ${ENABLE_DOCS:-0}
      # Observabilidad: errores a Sentry/GlitchTip si hay DSN (ver observability.py)
      APP_ENV: ${APP_ENV:-production}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0}
      # Captcha del alta online (opcional, Cloudflare Turnstile)
      TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:-}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-5}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-5}
      RECURSOS_DIR: /app/recursos
      # Hora del club para "hoy", el mes y el cierre de caja (la base queda en UTC)
      CLUB_TIMEZONE: ${CLUB_TIMEZONE:-America/Argentina/Buenos_Aires}
      CLUB_NAME: ${CLUB_NAME:-Mi Club}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@clubes.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Definir ADMIN_PASSWORD en .env}
    # /health verifica también la base: si MariaDB se cae, el contenedor queda "unhealthy"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3001/health', timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    # db_init corre las migraciones de Alembic (alembic upgrade head) antes de levantar
    command: >
      sh -c "python -m app.db_init && python -m app.seed &&
             uvicorn app.main:app --host 0.0.0.0 --port 3001 --workers 2"
