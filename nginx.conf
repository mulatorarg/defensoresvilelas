# Nginx para defensores.yacarestudio.com
#
# Instalación en el VPS:
#   sudo cp nginx.conf /etc/nginx/sites-available/defensores
#   sudo ln -s /etc/nginx/sites-available/defensores /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# TLS (agrega el bloque 443 y la redirección automáticamente):
#   sudo certbot --nginx -d defensores.yacarestudio.com
#
# La app publica UN solo puerto en loopback (PORT del .env, default 3030):
# API (/api/*), web estática (/) y archivos del club (/recursos/*).
# Si cambiás PORT en el .env del VPS, actualizá los proxy_pass de este archivo.

# Rate limit para los logins (staff y socios): 10 intentos/min por IP.
# Las zonas limit_req_zone viven en contexto http; este archivo se incluye
# desde sites-enabled, así que puede declararse acá arriba.
limit_req_zone $binary_remote_addr zone=login_zone:10m rate=10r/m;

server {
    listen 80;
    listen [::]:80;
    server_name defensores.yacarestudio.com;

    server_tokens off;

    # Subida de fotos de socios, comprobantes, etc.
    client_max_body_size 20m;

    # Compresión para la web estática y respuestas JSON de la API
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Headers de seguridad básicos
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Logins protegidos contra fuerza bruta
    location ~ ^/api/(auth|member-portal)/login$ {
        limit_req zone=login_zone burst=5 nodelay;
        proxy_pass http://127.0.0.1:3030;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:3030;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Cache agresiva para los assets con hash del build de Next
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3030;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Fotos y archivos del club (volumen recursos/)
    location /recursos/ {
        proxy_pass http://127.0.0.1:3030;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=86400";
    }
}
